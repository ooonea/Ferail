name: Native OS keyboard qualification

on:
  push:
    branches: [qa/selection-native-20261110]
    paths: [.github/workflows/native-os-keyboard.yml]
  workflow_dispatch:
    inputs:
      owner_authorized:
        description: Dedicated runner input explicitly authorized by owner
        type: boolean
        required: true
        default: false
      platform:
        description: Platform to qualify
        type: choice
        options: [both, macos, windows]
        default: both

permissions:
  contents: read

jobs:
  capture:
    if: github.event_name == 'workflow_dispatch' && inputs.owner_authorized
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJSON(inputs.platform == 'macos' && '["macos-15-intel"]' || inputs.platform == 'windows' && '["windows-2025"]' || '["macos-15-intel", "windows-2025"]') }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    env:
      CARGO_BUILD_JOBS: 2
      CARGO_PROFILE_DEV_DEBUG: 0
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v5
        with:
          path: qa
          persist-credentials: false
      - uses: actions/checkout@v5
        with:
          repository: jonx/Ferail
          ref: a586e950776cff46d618a30e890eca9add5dc13d
          path: source
          persist-credentials: false
      - name: Verify source and runner
        working-directory: source
        run: |
          test "$(git rev-parse HEAD)" = a586e950776cff46d618a30e890eca9add5dc13d
          python3 -c 'import platform; assert platform.machine() in ("x86_64", "AMD64"); print(platform.platform())'
          df -h
      - name: Compile Mac helper and measure existing permissions
        if: runner.os == 'macOS'
        run: |
          mkdir "$RUNNER_TEMP/ferail-native-os-keyboard"
          xcrun swiftc -parse-as-library -swift-version 5 qa/.github/qa/native-os-keyboard-macos.swift -o "$RUNNER_TEMP/ferail-native-os-keyboard/native-key" 2>&1 | tee "$RUNNER_TEMP/ferail-native-os-keyboard/compile.log"
          "$RUNNER_TEMP/ferail-native-os-keyboard/native-key" --preflight | tee "$RUNNER_TEMP/ferail-native-os-keyboard/preflight.jsonl"
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          lines = (Path(os.environ['RUNNER_TEMP']) / 'ferail-native-os-keyboard/preflight.jsonl').read_text().splitlines()
          value = [json.loads(line) for line in lines if line.startswith('{')][-1]
          assert all(value[k] for k in ('post_event', 'accessibility', 'screen_capture')), value
          PY
          xcrun swift -e 'import Metal; guard let device = MTLCreateSystemDefaultDevice() else { fatalError("No Metal device") }; print(device.name)'
      - name: Measure Windows interactive desktop
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $root = Join-Path $env:RUNNER_TEMP 'ferail-native-os-keyboard'
          New-Item -ItemType Directory $root | Out-Null
          & ./qa/.github/qa/native-os-keyboard-windows.ps1 -PreflightOnly -Output (Join-Path $root 'preflight')
      - uses: ilammy/setup-nasm@v1
        if: runner.os == 'Windows'
      - uses: dtolnay/rust-toolchain@1.97.1
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: source -> target
          cache-on-failure: true
      - name: Build pinned upstream source
        working-directory: source
        run: cargo build --locked -p ferail-gpui --bin ferail-gpui
      - uses: actions/upload-artifact@v7.0.2
        with:
          name: native-os-binary-${{ matrix.os }}
          path: |
            source/target/debug/ferail-gpui
            source/target/debug/ferail-gpui.exe
          if-no-files-found: error
          retention-days: 3
      - name: Exercise native OS keyboard path
        working-directory: source
        env:
          FERAIL_OS_INPUT_AUTHORIZED: ${{ runner.os == 'macOS' && 'macos-disposable-vm' || 'windows-disposable-vm' }}
        run: python3 ../qa/.github/qa/native-os-keyboard.py
      - uses: actions/upload-artifact@v7.0.2
        if: always()
        with:
          name: native-os-keyboard-${{ matrix.os }}
          path: |
            source/screenshots/native-os-keyboard/
            ${{ runner.temp }}/ferail-native-os-keyboard/
          retention-days: 3
