name: Native keyboard capability preflight

on:
  push:
    branches: [qa/selection-native-20261110]
    paths:
      - .github/workflows/native-os-keyboard-preflight.yml
      - .github/qa/native-os-keyboard-macos.swift
      - .github/qa/native-os-keyboard-windows.ps1

permissions:
  contents: read

jobs:
  macos:
    runs-on: macos-15-intel
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - name: Compile permission probe
        shell: bash
        run: |
          mkdir "$RUNNER_TEMP/ferail-native-os-keyboard"
          xcrun swiftc -parse-as-library -swift-version 5 .github/qa/native-os-keyboard-macos.swift -o "$RUNNER_TEMP/ferail-native-os-keyboard/native-key" 2>&1 | tee "$RUNNER_TEMP/ferail-native-os-keyboard/compile.log"
      - name: Measure existing permissions without requesting grants
        shell: bash
        run: |
          "$RUNNER_TEMP/ferail-native-os-keyboard/native-key" --preflight | tee "$RUNNER_TEMP/ferail-native-os-keyboard/preflight.jsonl"
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          lines = (Path(os.environ['RUNNER_TEMP']) / 'ferail-native-os-keyboard/preflight.jsonl').read_text().splitlines()
          permissions = [json.loads(line) for line in lines if line.startswith('{')][-1]
          assert all(permissions[k] for k in ['post_event', 'accessibility', 'screen_capture']), permissions
          PY
      - uses: actions/upload-artifact@v7.0.2
        if: always()
        with:
          name: macos-keyboard-preflight
          path: ${{ runner.temp }}/ferail-native-os-keyboard/
          retention-days: 3

  windows:
    runs-on: windows-2025
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - name: Measure existing interactive desktop without sending input
        shell: pwsh
        run: |
          $root = Join-Path $env:RUNNER_TEMP 'ferail-native-os-keyboard'
          New-Item -ItemType Directory $root | Out-Null
          try {
            & ./.github/qa/native-os-keyboard-windows.ps1 -PreflightOnly -Output (Join-Path $root 'preflight')
          } catch {
            $_ | Out-String | Set-Content (Join-Path $root 'blocked.txt')
            throw
          }
      - uses: actions/upload-artifact@v7.0.2
        if: always()
        with:
          name: windows-keyboard-preflight
          path: ${{ runner.temp }}/ferail-native-os-keyboard/
          retention-days: 3
